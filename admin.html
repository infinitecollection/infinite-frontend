<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Admin – Add Product</h2>

<div style="max-width:500px; margin:auto;">
  <input id="name" placeholder="Product name"><br><br>
  <input id="price" type="number" placeholder="Price"><br><br>
  <input id="image" placeholder="Image URL (or image name)"><br><br>
  <input id="rating" type="number" step="0.1" placeholder="Rating"><br><br>
  <input id="category" placeholder="Category (Tshirt, Shoes etc)"><br><br>
  <textarea id="description" placeholder="Description"></textarea><br><br>

  <button onclick="addProduct()">Add Product</button>
</div>

<!-- Firebase FIRST -->
<script type="module" src="js/firebase.js"></script>
<!-- Admin Logic -->
<script type="module" src="js/admin.js"></script>

</body>
</html>
